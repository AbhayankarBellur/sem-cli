name: Publish sem-cli to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build distribution and publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC)
      id-token: write
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Run test suite
        run: |
          python -m pip install -e ".[dev]"
          pytest -v

      - name: Build binary wheel and source distribution
        run: |
          python -m build

      - name: Verify package distributions
        run: |
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses OIDC Trusted Publishing (or fallback PYPI_API_TOKEN secret if configured)
          password: ${{ secrets.PYPI_API_TOKEN }}
