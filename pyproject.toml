[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sem-cli"
version = "0.1.0"
description = "Software Engineering Metrics & Intelligence CLI (ISWE402L)"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ISWE402L Engineering Metrics Team"}
]
keywords = ["software-metrics", "static-analysis", "git-mining", "cli", "tui", "gemini"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.7.0",
    "scipy>=1.12.0",
    "numpy>=1.26.0",
    "radon>=6.0.0",
    "lizard>=1.17.0",
    "google-genai>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
sem = "sem_cli.main:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
